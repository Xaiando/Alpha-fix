[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-fix"
version = "3.0.0"
description = "A unified desktop workspace for guided alpha-matte cleanup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.4", "opencv-python==4.13.0.92", "PySide6>=6.8,<7"]

[project.scripts]
alpha-fix = "alpha_fix.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
